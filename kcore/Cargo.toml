[package]
name = "kanki-core"
version = "1.0.0"
edition = "2021"
description = "Kanki Cores (Game-FEC, HQ-QUIC, FakeTCP): the server and the app client in one small binary"

# Not part of the panel's build: the transport sources are the panel's own files (src/tunnel/*.rs),
# compiled here through #[path], so the core and the panel can never speak two versions of them.

[[bin]]
name = "kanki-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
x25519-dalek = "2"
chacha20poly1305 = "0.10"
chacha20 = "0.9"
hkdf = "0.12"
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.13"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
tokio_kcp = "0.9"
reed-solomon-simd = "3.0.1"
libc = "0.2"
h2 = "0.4"
http = "1"
bytes = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
