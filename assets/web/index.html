<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0906">
<title>Kanki Panel</title>
<style>
:root{--a:#F5C451;--al:#FFE9A6;--ad:#B8862B;--ok:#3ddc97;--bad:#ff6b6b;--warn:#ffb547;--info:#6fb6ff;--t:#F7F1E3;--s:#A89C82;--ln:rgba(245,196,81,.2);--c1:rgba(28,23,14,.94);--c2:rgba(12,10,6,.97);--bg1:#0c0a06;--bg2:#17110a;--in:rgba(0,0,0,.28)}
body.c-turquoise{--a:#2fd6d6;--al:#9ff3f3;--ad:#1590a8;--ln:rgba(47,214,214,.2)}
body.c-violet{--a:#a78bfa;--al:#ddd3ff;--ad:#6d4fd8;--ln:rgba(167,139,250,.22)}
body.c-emerald{--a:#34d399;--al:#b7f5dc;--ad:#119068;--ln:rgba(52,211,153,.2)}
body.c-rose{--a:#fb7185;--al:#ffd0d7;--ad:#c23a55;--ln:rgba(251,113,133,.22)}
body.light{--t:#2a2010;--s:#7a6a4a;--c1:#fffaf0;--c2:#fbf4e4;--bg1:#f6efe0;--bg2:#ece0c6;--in:rgba(255,255,255,.7);--ln:rgba(120,90,30,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;background:linear-gradient(var(--bg1),var(--bg2) 50%,var(--bg1));background-attachment:fixed;color:var(--t);font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;font-size:14px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -10%,color-mix(in srgb,var(--a) 18%,transparent),transparent 55%)}
a{color:var(--a)}
.ltr{direction:ltr;unicode-bidi:isolate}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 14px;background:color-mix(in srgb,var(--bg1) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--al),var(--a),var(--ad));color:#1a1206;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px color-mix(in srgb,var(--a) 40%,transparent)}
.bn b{display:block;color:var(--a);font-size:14px;letter-spacing:.5px;white-space:nowrap}.bn small{color:var(--s);font-size:11px}
.sp{flex:1}
.ib{border:1px solid var(--ln);background:var(--c1);color:var(--t);border-radius:11px;min-width:36px;height:34px;padding:0 9px;cursor:pointer;font:inherit;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.ib.on{background:var(--a);color:#1a1206;font-weight:800}
.dot{width:7px;height:7px;border-radius:50%;background:var(--s);display:inline-block}.dot.g{background:var(--ok)}.dot.r{background:var(--bad)}.dot.y{background:var(--warn)}
nav.side{position:fixed;top:0;bottom:0;inset-inline-start:0;width:250px;background:linear-gradient(var(--c1),var(--c2));border-inline-end:1px solid var(--ln);z-index:8;transform:translateX(calc(var(--dir,1)*100%));transition:.25s;padding:16px 10px;overflow:auto}
html[dir=rtl] nav.side{--dir:1}html[dir=ltr] nav.side{--dir:-1}
nav.side.on{transform:none}
nav.side a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:var(--t);text-decoration:none;margin-bottom:4px}
nav.side a.on,nav.side a:hover{background:color-mix(in srgb,var(--a) 16%,transparent);color:var(--a)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:7;display:none}.shade.on{display:block}
main{max-width:1100px;margin:auto;padding:16px 14px 60px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 0 14px;flex-wrap:wrap}
.ph h2{margin:0;font-size:22px}.ph p{margin:3px 0 0;color:var(--s);font-size:12px}
.card{background:linear-gradient(var(--c1),var(--c2));border:1px solid var(--ln);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 8px 26px rgba(0,0,0,.22)}
.card h3{margin:0 0 4px;font-size:16px}.card .sub{color:var(--s);font-size:12px;margin:0 0 12px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:820px){.g2,.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.g2{grid-template-columns:1fr}}
.stat{background:linear-gradient(var(--c1),var(--c2));border:1px solid var(--ln);border-radius:18px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.stat small{color:var(--s);display:block}.stat b{font-size:26px;display:block;margin-top:4px}
.stat i{font-style:normal;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid var(--ln);font-size:16px}
.k-ok b{color:var(--ok)}.k-bad b{color:var(--bad)}.k-warn b{color:var(--warn)}.k-info b{color:var(--info)}
.pc{border:1px solid var(--ln);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between}
.btn{background:linear-gradient(var(--al),var(--a),var(--ad));color:#1a1206;border:0;border-radius:13px;padding:10px 16px;font:inherit;font-weight:800;cursor:pointer}
.btn:disabled{opacity:.5}
.b2{background:transparent;color:var(--t);border:1px solid var(--ln);border-radius:12px;padding:9px 12px;font:inherit;cursor:pointer;font-size:13px}
.b2:hover{border-color:var(--a)}
.b2:disabled,.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
.li button,.row button{white-space:nowrap}
.b2.on{background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--a);border-color:var(--a)}
.bd{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
label.f{display:block;font-size:12px;color:var(--s);margin:8px 0 4px}
input,select,textarea{width:100%;background:var(--in);border:1px solid var(--ln);color:var(--t);border-radius:12px;padding:10px 11px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--a)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--a)}
textarea{min-height:80px;resize:vertical}
.chk{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ln);border-radius:12px;padding:8px 10px;margin:3px;cursor:pointer;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;margin-bottom:10px}
@media(max-width:620px){.tools{grid-template-columns:1fr 1fr}}
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.uc{background:linear-gradient(var(--c1),var(--c2));border:1px solid var(--ln);border-radius:18px;padding:12px}
.uc .top{display:flex;align-items:center;gap:8px}
.uc .nm{font-weight:800;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.tag{border:1px solid var(--ln);border-radius:9px;padding:2px 8px;font-size:11px;color:var(--s)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini div{border:1px solid var(--ln);border-radius:12px;padding:7px;text-align:center;font-size:13px}
.trk{height:6px;border-radius:9px;background:rgba(127,127,127,.2);overflow:hidden;margin-top:6px}
.fil{height:100%;background:linear-gradient(90deg,var(--ad),var(--a));border-radius:9px}
.fil.hot{background:linear-gradient(90deg,#d9822b,var(--bad))}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.acts button{border:1px solid var(--ln);border-radius:11px;padding:8px 0;background:transparent;color:var(--t);cursor:pointer;font-size:14px}
.acts .x{color:var(--bad)}
.sw{position:relative;width:44px;height:24px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:20px;background:rgba(127,127,127,.35);transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;inset-inline-start:3px;transition:.2s}
.sw input:checked+span{background:var(--a)}
html[dir=rtl] .sw input:checked+span:before{transform:translateX(-20px)}html[dir=ltr] .sw input:checked+span:before{transform:translateX(20px)}
.ncards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ncards .g2{grid-template-columns:1fr 1fr}.ncards .g3{grid-template-columns:repeat(3,1fr)}
.badge{font-size:11px;border-radius:9px;padding:2px 8px;border:1px solid var(--ln)}
.badge.g{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}.badge.r{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}.badge.y{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.list{display:flex;flex-direction:column;gap:6px;max-height:360px;overflow:auto}
.li{border:1px solid var(--ln);border-radius:12px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}
.li small{color:var(--s);display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:center;justify-content:center;padding:14px}
.modal.on{display:flex}
.mbox{background:linear-gradient(var(--c1),var(--c2));border:1px solid var(--ln);border-radius:20px;padding:16px;width:min(620px,100%);max-height:92vh;overflow:auto}
.mh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.mh small{color:var(--s);display:block}
.box{border:1px solid var(--ln);border-radius:14px;padding:10px;margin:10px 0}
.box>b{display:block;margin-bottom:6px}
pre{direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all;background:var(--in);padding:10px;border-radius:12px;font-size:11px}
.qr{background:#fff;border-radius:14px;padding:10px;display:flex;justify-content:center}.qr img,.qr svg{width:min(260px,70vw);height:auto}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--a);color:#1a1206;padding:9px 16px;border-radius:12px;font-weight:800;display:none;z-index:30;max-width:90vw}
#toast.e{background:var(--bad);color:#fff}
.login{max-width:380px;margin:12vh auto;padding:0 14px}
.login .logo{width:64px;height:64px;font-size:30px;margin:0 auto 12px;border-radius:20px}
.muted{color:var(--s);font-size:12px}
.pager{display:flex;justify-content:center;gap:6px;margin-top:12px}
.strip{display:flex;flex-wrap:nowrap;gap:5px;align-items:center;padding:7px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;border-radius:14px}.strip::-webkit-scrollbar{display:none}
.strip .sp{flex:1}
.sc{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--ln);border-radius:9px;padding:3px 7px;font-size:11px;flex:none;background:var(--in);white-space:nowrap}
.sc b{font-size:12px}.sc.pr{color:var(--s)}.sc.pr b{color:var(--t)}.sc.tot{border-color:var(--a)}
.tools{grid-template-columns:1fr auto auto auto}
.pills{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.up{position:relative;display:flex;align-items:center;gap:7px;border:1px solid var(--ln);border-radius:12px;padding:9px 10px 11px;background:linear-gradient(var(--c1),var(--c2));color:var(--t);cursor:pointer;font:inherit;min-width:0;overflow:hidden}
.up:hover{border-color:var(--a)}.up.sel{border-color:var(--a);box-shadow:0 0 0 2px color-mix(in srgb,var(--a) 35%,transparent)}
.up.st-disabled{opacity:.55}
.up .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start;font-weight:700;font-size:13px}
.up small{color:var(--s);font-size:10px}
.up .ub{position:absolute;left:8px;right:8px;bottom:4px;height:3px;border-radius:3px;background:rgba(127,127,127,.18)}
.up .ub i{display:block;height:100%;border-radius:3px;background:var(--a)}
.up.st-finished .ub i{background:var(--warn)}.up.st-disabled .ub i{background:var(--bad)}
.g2f{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.g2f .full{grid-column:1/-1}
.chips{margin-top:6px}.chips .chk{padding:6px 8px;font-size:12px}
.g3s{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;margin:6px 0}
.g3s>div{border:1px solid var(--ln);border-radius:12px;padding:8px;min-width:0}
.g3s small{display:block;color:var(--s);font-size:10px}.g3s b{display:block;font-size:13px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:8px 0}
.qa button,.qa a{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--ln);border-radius:11px;padding:7px 2px;background:transparent;color:var(--t);cursor:pointer;font:inherit;font-size:15px;text-decoration:none}
.qa span{font-size:10px;color:var(--s);white-space:nowrap}.qa .x{color:var(--bad)}
details.box summary{cursor:pointer;list-style:none}details.box summary::-webkit-details-marker{display:none}
.mbox{width:min(460px,100%)}
.mbox input:not([type=checkbox]):not([type=radio]){padding:8px 10px}
@media(max-width:620px){.tools{grid-template-columns:1fr auto auto}.tools #q{grid-column:1/-1}}
.hide{display:none!important}
.warnbox{border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn);border-radius:12px;padding:8px 10px;font-size:12px;margin:8px 0}
/* ===== v2.1: live dashboard + BUB-style users, Kanki gold ===== */
body{font-variant-numeric:tabular-nums}
.card{box-shadow:inset 0 1px 0 rgba(255,233,166,.05),0 8px 26px rgba(0,0,0,.22)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--al);outline-offset:2px}
@media(min-width:1100px){
 nav.side{transform:none!important;top:59px;width:236px;z-index:4}
 nav.side>.row:first-child{display:none}
 #mn{display:none}.shade{display:none!important}
 main{max-width:none;margin:0;margin-inline-start:252px;padding-inline:22px}
}
@media(max-width:620px){.modal{align-items:flex-end;padding:0}.mbox{width:100%!important;border-radius:22px 22px 0 0;max-height:94vh;padding-bottom:calc(16px + env(safe-area-inset-bottom))}}
.mbox.wide{width:min(580px,100%)}

/* ---- live indicator ---- */
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--s);padding:5px 11px;border:1px solid var(--ln);border-radius:20px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:lp 2s infinite}
.live.off i{background:var(--s);animation:none}.live.bad i{background:var(--bad);animation:none}
@keyframes lp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media(prefers-reduced-motion:reduce){.live i{animation:none}.rf{transition:none!important}}

/* ---- KPI strip ---- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{background:linear-gradient(var(--c1),var(--c2));border:1px solid var(--ln);border-radius:16px;padding:10px 11px;text-align:start;color:var(--t);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi:hover{border-color:var(--a)}
.kpi small{color:var(--s);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{font-size:21px;line-height:1.15}
.kpi.g b{color:var(--ok)}.kpi.y b{color:var(--warn)}.kpi.r b{color:var(--bad)}.kpi.a b{color:var(--a)}

/* ---- gauges ---- */
.gg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:900px){.gg{grid-template-columns:repeat(4,1fr)}}
.gc{background:linear-gradient(var(--c1),var(--c2));border:1px solid var(--ln);border-radius:22px;padding:12px 12px 8px;min-width:0;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,233,166,.05)}
.gc.warm{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.gc.hot{border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.gh{display:flex;align-items:center;gap:7px;color:var(--s);font-size:12px;margin-bottom:6px}.gh b{color:var(--t);font-size:13px}
.gb{display:flex;align-items:center;gap:10px}
.ring{width:76px;height:76px;flex:none;direction:ltr}
.rb{fill:none;stroke:rgba(127,127,127,.2);stroke-width:7}
.rf{fill:none;stroke:url(#gGold);stroke-width:7;stroke-linecap:round;transition:stroke-dasharray .7s ease}
.gc.warm .rf{stroke:var(--warn)}.gc.hot .rf{stroke:var(--bad)}
.rt{fill:var(--t);font-size:17px;font-weight:800}
.gi{min-width:0}.gi b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gi small{display:block;color:var(--s);font-size:11px;margin-top:2px}
.ch{height:54px;margin-top:6px;direction:ltr}.ch svg{width:100%;height:100%;display:block}
.ch.tall{height:132px;margin-top:10px}
.ar-a{fill:url(#gFa)}.ar-b{fill:url(#gFb)}
.ln-a,.ln-b{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.ln-a{stroke:var(--a)}.ln-b{stroke:var(--info)}
.gridl{stroke:rgba(127,127,127,.18);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:3 4}

/* ---- network / connections ---- */
.dwide{align-items:stretch;margin-bottom:12px}.dwide .card{margin:0}
.nh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.nh h3{margin:0}
.nbig{display:flex;gap:18px}
.nbig small{display:block;color:var(--s);font-size:11px}
.nbig b{font-size:22px;line-height:1.25;white-space:nowrap}
.nbig .dn b{color:var(--a)}.nbig .upl b{color:var(--info)}
.nf{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--s);font-size:11px;margin-top:8px}.nf b{color:var(--t);font-weight:700}

/* ---- services ---- */
.svcs{display:flex;flex-direction:column;gap:8px}
.svc{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;border:1px solid var(--ln);border-radius:14px;padding:10px 12px;background:var(--in)}
.sn{display:flex;align-items:center;gap:9px;min-width:0}.sn b{display:block;font-size:13px}.sn small{display:block;color:var(--s);font-size:10px}
.sbtn{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(min-width:700px){.svc{grid-template-columns:1fr auto auto}.sbtn{grid-column:auto;display:flex}}
.sb{border:1px solid var(--ln);background:transparent;color:var(--t);border-radius:10px;padding:7px 11px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.sb:hover:not(:disabled){border-color:var(--a);color:var(--a)}
.sb.on:not(:disabled){color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.sb.off:not(:disabled){color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.sb:disabled{opacity:.35;cursor:not-allowed}

/* ---- users: toolbar ---- */
button.sc{font:inherit;font-size:11px;color:var(--t);cursor:pointer}
.sc.act{border-color:var(--a);background:color-mix(in srgb,var(--a) 14%,transparent)}
.utools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.utools .srch{grid-column:1/-1;position:relative}
.utools .srch input{padding-inline-end:36px}
.utools .srch button{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--s);width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:14px}
.utools select{padding:9px 8px;font-size:13px;text-overflow:ellipsis}
@media(min-width:760px){.utools{grid-template-columns:minmax(220px,1fr) 150px 150px 150px}.utools .srch{grid-column:auto}}
.selbar{display:flex;align-items:center;gap:10px;margin:2px 2px 10px;color:var(--s);font-size:12px}
.selbar label{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--t);font-size:13px}

/* ---- users: checkbox ---- */
.ck{position:relative;flex:none;width:22px;height:22px;display:inline-block;cursor:pointer}
.ck input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;padding:0;border:0;cursor:pointer}

function smoothPath(pts){var i,d;if(pts.length<3){d='';for(i=0;i<pts.length;i++)d+=(i?'L':'M')+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1);return d}
 d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
 for(i=1;i<pts.length-1;i++)d+='Q'+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1)+' '+((pts[i][0]+pts[i+1][0])/2).toFixed(1)+' '+((pts[i][1]+pts[i+1][1])/2).toFixed(1);
 var l=pts[pts.length-1];return d+'L'+l[0].toFixed(1)+' '+l[1].toFixed(1)}
// series: [{v:[numbers],c:'a'|'b'}]  o:{h,max,cap}
function areaChart(series,o){var W=300,H=o.h||100,cap=o.cap||60,mx=o.max||0,i,j,s;
 if(!o.max){for(i=0;i<series.length;i++)for(j=0;j<series[i].v.length;j++)if(series[i].v[j]>mx)mx=series[i].v[j];mx=mx>0?mx*1.2:1}
 var out='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">',step=W/(cap-1);
 for(i=1;i<4;i++)out+='<path class="gridl" d="M0 '+(H*i/4).toFixed(1)+'H'+W+'"/>';
 for(i=0;i<series.length;i++){s=series[i];if(!s.v.length)continue;var pts=[],n=s.v.length;
  for(j=0;j<n;j++)pts.push([W-(n-1-j)*step,H-2-Math.min(1,s.v[j]/mx)*(H-6)]);
  var line=smoothPath(pts),first=pts[0][0];
  out+='<path class="ar-'+s.c+'" d="'+line+'L'+W+' '+H+'L'+first.toFixed(1)+' '+H+'Z"/><path class="ln-'+s.c+'" d="'+line+'"/>'}
 return out+'</svg>'}

function setLogo(data){return api('PUT','/api/settings',{logo:data}).then(function(){S.me.logo=data;try{localStorage.setItem('kk_logo',data)}catch(e){}toast(t('Saved'));shell();route()})}
function wireLogo(){var f=$('#lg_file');if(!f)return;
 f.onchange=function(){var file=f.files&&f.files[0];if(!file)return;var rd=new FileReader();
  rd.onload=function(){var im=new Image();im.onload=function(){var best='',sz=[256,192,128],iw=im.width||256,ih=im.height||256;
    for(var i=0;i<sz.length&&!best;i++){var cv=document.createElement('canvas');cv.width=cv.height=sz[i];var cx=cv.getContext('2d'),r=Math.min(sz[i]/iw,sz[i]/ih),w=iw*r,h=ih*r;
     cx.drawImage(im,(sz[i]-w)/2,(sz[i]-h)/2,w,h);var d=cv.toDataURL('image/png');if(d.length<150000)best=d}
    if(!best)return toast(t('Image is too complex, use a simpler logo'),1);setLogo(best).catch(fail)};
   im.onerror=function(){toast(t('Cannot read this image'),1)};im.src=rd.result};
  rd.readAsDataURL(file)};
 var rm=$('#lg_rm');if(rm)rm.onclick=function(){confirmDo(function(){setLogo('').catch(fail)})}}
