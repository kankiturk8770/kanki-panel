<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>پنل کاربری · Kanki VPN</title>
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<style>
@font-face{font-family:Vazirmatn;src:url(/assets/vazirmatn.woff) format("woff");font-weight:100 900;font-display:swap}
:root{
 /* Kanki's own look (the app's yellow and crimson), the same in every Telegram theme: night wine with Kanki gold */
 --bg:#170a10;--bg2:#2a1019;--bg3:#3d1624;--tx:#fff3e4;--hint:#bc9ea8;--link:#f7c948;--btn:#f7c948;--btx:#2a1206;
 --sep:rgba(247,201,72,.14);--gold1:#ffe9a6;--gold2:#f7c948;--gold3:#b8862a;--ink:#2a1206;
 --ok:#3ddc97;--warn:#ffb547;--bad:#ff5c6c;
 /* one colour per app and per system, so each is told apart at a glance */
 --k:#f7c948;--z:#ff8a3d;--v:#a78bfa;--g:#ff6b81;--sa:#3ddc84;--si:#8fb8ff;--sw:#4cc2ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 Vazirmatn,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate}
.hide{display:none!important}
.muted{color:var(--hint)}

/* account switcher */
.accs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.accs button{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--sep);background:var(--bg2);cursor:pointer;font-weight:700}
.accs button.on{border-color:var(--gold2);color:var(--gold2)}

/* the pass: the one bold thing on the page */
.pass{position:relative;border-radius:18px;overflow:hidden;color:var(--tx);
 background:radial-gradient(120% 140% at 100% 0%,#5a1a2f 0%,var(--bg2) 55%,#200c14 100%);
 border:1px solid color-mix(in srgb,var(--gold2) 35%,transparent);box-shadow:0 12px 28px -18px rgba(247,201,72,.5)}
.pass .top{padding:12px 14px 10px}
.pass .who{display:flex;align-items:center;gap:8px}
.pass .who b{font-size:18px;font-weight:900;letter-spacing:.2px;color:var(--gold1)}
.pass .st{margin-inline-start:auto;font-size:12px;font-weight:800;padding:2px 10px;border-radius:10px;background:rgba(255,255,255,.07)}
.pass .st i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:0}
.pass .big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pass .big small{display:block;font-size:12px;font-weight:700;color:var(--hint)}
.pass .big strong{display:block;font-size:20px;font-weight:900;line-height:1.3;color:var(--gold2)}
.pass .big em{font-style:normal;font-size:12px;font-weight:700;color:var(--hint)}
.pass .big strong em{color:var(--tx)}
.pass .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden}
.pass .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--z));border-radius:3px}
/* the tear line between the pass and its stub */
.pass .tear{position:relative;height:0;border-top:2px dashed rgba(247,201,72,.25);margin:0 14px}
.pass .tear:before,.pass .tear:after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.pass .tear:before{right:-25px}.pass .tear:after{left:-25px}
.pass .stub{padding:10px 14px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pass .routes{display:flex;gap:6px;flex-wrap:wrap;font-size:20px;line-height:1}
.pass .stub small{font-size:12px;color:var(--hint);margin-inline-start:auto}
.pass .copy{margin-inline-start:auto;min-height:40px;padding:0 14px;border:0;border-radius:12px;background:var(--ink);color:var(--gold1);font-weight:800;cursor:pointer}

/* sections */
h2{font-size:16px;font-weight:900;margin:24px 2px 4px}
.lead{margin:0 2px 12px;color:var(--hint);font-size:13px}
.card{background:var(--bg2);border-radius:16px;padding:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--bg)}
.seg button{min-height:40px;border:0;border-radius:10px;background:transparent;font-weight:700;cursor:pointer;color:var(--hint)}
.seg button.on{background:var(--bg2);color:var(--tx);box-shadow:0 0 0 1px var(--sep)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts.one{grid-template-columns:1fr}
.b{min-height:44px;border-radius:12px;border:1px solid var(--sep);background:transparent;font-weight:800;cursor:pointer;padding:0 12px}
.b.main{border:0;background:var(--btn);color:var(--btx)}
.b:disabled{opacity:.5}
.steps{margin:12px 2px 0;padding:0;list-style:none;counter-reset:s;font-size:13px;color:var(--hint)}
.steps li{counter-increment:s;display:flex;gap:8px;margin:4px 0}
.steps li:before{content:counter(s,persian);flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--bg);color:var(--tx)}

.row{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 4px}
.row+.row{border-top:1px solid var(--sep)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:800}
.row .nm b.sn{text-align:right}
.row .nm small{display:block;font-size:12px;color:var(--hint)}
.row .fl{font-size:18px;flex:none;min-width:52px;text-align:center}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.tags span{font-size:12px;padding:0 8px;line-height:20px;border-radius:8px;border:1px solid var(--sep);color:var(--hint)}
.row .b{flex:none;min-height:40px}

/* the three tabs of an account (and buy) */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--bg2);margin:0 0 12px;position:sticky;top:0;z-index:5}
.tabs.two{grid-template-columns:1fr 1fr}
.tabs button{min-height:40px;border:0;border-radius:10px;background:transparent;font-weight:800;cursor:pointer;color:var(--hint)}
.tabs button.on{background:var(--bg);color:var(--tx);box-shadow:0 0 0 1px var(--sep)}

/* custom purchase */
.vol{display:flex;align-items:center;gap:12px;justify-content:center;margin:4px 0 8px}
.vol .n{min-width:132px;text-align:center}
.vol .n strong{display:block;font-size:20px;font-weight:900;line-height:1.2}
.vol .n strong span{font-size:32px}
.vol .n small{font-size:12px;color:var(--hint)}
.step{width:44px;height:44px;border-radius:14px;border:1px solid var(--sep);background:var(--bg);font-size:20px;font-weight:900;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--gold2);height:32px;margin:0}
.lbl{display:block;font-size:13px;font-weight:800;margin:12px 2px 6px}
.chips2{display:flex;gap:6px;flex-wrap:wrap}
.chips2 button{flex:1 0 auto;min-height:40px;min-width:64px;padding:0 12px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);font-weight:700;cursor:pointer}
.chips2 button.on{border-color:var(--gold2);background:color-mix(in srgb,var(--gold2) 16%,var(--bg));color:var(--tx)}
.total{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:12px;border-top:1px dashed var(--sep)}
.total .p{flex:1}
.total .p small{display:block;font-size:12px;color:var(--hint)}
.total .p strong{font-size:20px;font-weight:900}
.b.go{border:0;background:var(--ok);color:#fff;min-width:150px}

/* listed plans: the stripe is the colour of the plan's button in the bot */
.plan{display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--bg2);margin-bottom:8px;border-inline-start:4px solid var(--sep)}
.plan.success{border-inline-start-color:var(--ok)}.plan.primary{border-inline-start-color:#3b8be0}.plan.danger{border-inline-start-color:var(--bad)}
.plan .nm{flex:1;min-width:0}
.plan .nm b{display:block;font-weight:800}
.plan .nm small{display:block;font-size:12px;color:var(--hint)}
.plan .pr{text-align:left;font-weight:900;white-space:nowrap}
.plan .b{min-height:40px;flex:none}
.cat{font-size:13px;font-weight:800;color:var(--hint);margin:16px 2px 8px}

/* config name, trial, orders */
.in{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);color:var(--tx);font:inherit;padding:0 12px;direction:ltr;text-align:left}
.in:focus{outline:2px solid var(--gold2);outline-offset:1px}
.b.blue{border:0;background:#3b8be0;color:#fff}
.ost{font-size:12px;font-weight:800;padding:2px 10px;border-radius:10px;white-space:nowrap}
.ost.g{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.ost.y{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.ost.r{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}

/* subscription tab */
.cta{display:grid;gap:8px;margin-top:12px}
.cta .b{min-height:52px;font-size:15px}
.code{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--bg2)}
.code .nm{flex:1;min-width:0}
.code .nm small{display:block;font-size:12px;color:var(--hint)}
.code .nm b{display:block;font-size:17px;letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svc{display:inline-block;margin-top:6px;font-size:12px;font-weight:800;padding:1px 10px;border-radius:10px;background:rgba(247,201,72,.12);color:var(--gold1)}
/* the connect card: the link and the code, each a row with its copy button */
.conn{margin-top:12px;background:var(--bg2);border-radius:16px;padding:4px 12px;border:1px solid var(--sep)}
.conn .r{display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 0}
.conn .r+.r{border-top:1px solid var(--sep)}
.conn .r .nm{flex:1;min-width:0}
.conn .r .nm small{display:block;font-size:12px;color:var(--hint);font-weight:700}
.conn .r .nm b{display:block;font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conn .r .nm b.lk{white-space:normal;word-break:break-all;font-size:13px;font-weight:700;line-height:1.5;text-align:left}
.conn .r .b{flex:none;min-height:40px;min-width:72px}
.conn .dot{width:10px;height:10px;border-radius:50%;flex:none}
/* servers: one tile per country, its files below */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ctile{min-height:84px;border-radius:16px;border:1px solid var(--sep);background:var(--bg2);cursor:pointer;display:grid;place-items:center;gap:2px;padding:8px 4px;color:var(--tx)}
.ctile .f{font-size:30px;line-height:1}
.ctile b{font-size:13px;font-weight:800}
.ctile small{font-size:11px;color:var(--hint)}
.ctile.on{border-color:var(--gold2);background:var(--bg3);box-shadow:0 0 0 1px var(--gold2) inset}
.cpanel{margin-top:12px;background:var(--bg2);border-radius:16px;padding:6px 12px;border:1px solid var(--sep)}
.cpanel h3{margin:8px 0 2px;font-size:15px;font-weight:900}
.opt{display:flex;align-items:center;gap:10px;min-height:64px;padding:8px 0}
.opt+.opt{border-top:1px solid var(--sep)}
.opt .ic{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:900;font-size:15px;color:#1c0a10}
.opt .nm{flex:1;min-width:0}
.opt .nm b{display:block;font-weight:800;direction:ltr;text-align:right;unicode-bidi:plaintext}
.opt .nm small{display:block;font-size:12px;color:var(--hint)}
.opt .b{flex:none;min-height:40px}
/* apps: one folding card per app, in the app's colour */
.plats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
.plats button{min-height:44px;border-radius:14px;border:1px solid var(--sep);background:var(--bg2);font-weight:800;cursor:pointer;color:var(--hint);display:flex;align-items:center;justify-content:center;gap:6px}
.plats button i{width:8px;height:8px;border-radius:50%;background:currentColor}
.plats button.on{color:var(--tx);background:var(--bg3);border-color:var(--pc)}
.plats button.on i{background:var(--pc)}
details.app{margin-bottom:10px;background:var(--bg2);border-radius:16px;border:1px solid var(--sep);border-inline-start:4px solid var(--ac);overflow:hidden}
details.app summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 12px;cursor:pointer}
details.app summary::-webkit-details-marker{display:none}
details.app summary .ic{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:900;font-size:16px;color:#1c0a10;background:var(--ac)}
details.app summary .nm{flex:1;min-width:0}
details.app summary .nm b{display:block;font-size:15px;font-weight:900;direction:ltr;text-align:right;unicode-bidi:plaintext}
details.app summary .nm small{display:block;font-size:12px;color:var(--hint)}
details.app summary .rec{font-size:11px;font-weight:800;padding:1px 8px;border-radius:8px;color:#1c0a10;background:var(--ac);flex:none}
details.app summary .chev{width:10px;height:10px;border-right:2px solid var(--hint);border-bottom:2px solid var(--hint);transform:rotate(45deg);transition:transform .2s;flex:none;margin:0 4px 4px}
details.app[open] summary .chev{transform:rotate(225deg);margin-bottom:-4px}
details.app .body{padding:0 12px 12px}
details.app .steps li:before{background:color-mix(in srgb,var(--ac) 22%,var(--bg));color:var(--tx)}
details.app .b.main{background:var(--ac);color:#1c0a10}
a.b{display:grid;place-items:center;text-decoration:none;color:inherit}
/* servers tab: one block per country */
.ctry{background:var(--bg2);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.ctry .h{display:flex;align-items:center;gap:10px}
.ctry .h .f{font-size:26px;line-height:1}
.ctry .h b{flex:1;font-size:15px;font-weight:900}
.ctry .h small{color:var(--hint);font-size:12px}
.way{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--sep);font-size:13px}
.way>span{font-weight:800;min-width:76px}
/* apps tab */
.appc{background:var(--bg2);border-radius:16px;padding:12px;margin-top:10px}
.appc .t{display:flex;align-items:center;gap:10px}
.appc .t b{flex:1;font-size:15px;font-weight:900}
.appc .t .rec{font-size:11px;font-weight:800;padding:1px 8px;border-radius:8px;color:var(--ink);background:var(--gold2)}
.b.go{border:0;background:var(--ok);color:#06210f}
details.more{margin-top:10px}
details.more summary{cursor:pointer;font-weight:800;color:var(--hint);padding:8px 2px;list-style-position:inside}

/* brand bar */
.brand{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.brand svg{width:30px;height:34px;flex:none;filter:drop-shadow(0 0 8px rgba(247,201,72,.45))}
.brand b{font-size:18px;font-weight:900;letter-spacing:.5px;color:var(--gold2);direction:ltr}
.brand small{margin-inline-start:auto;font-size:13px;font-weight:800;color:var(--hint)}
/* the shop: one tab per kind of plan, one card per plan */
.ptabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin:0 0 12px}
.ptabs button{min-height:44px;padding:0 6px;border-radius:14px;border:1px solid var(--sep);background:var(--bg2);font-weight:800;font-size:13px;cursor:pointer;color:var(--hint);white-space:nowrap}
.ptabs button.on{background:var(--gold2);border-color:var(--gold2);color:#111;box-shadow:0 0 18px rgba(247,201,72,.35)}
.pc{position:relative;border-radius:20px;background:linear-gradient(160deg,#341320,#1f0b13);border:1px solid var(--sep);padding:14px;margin-bottom:12px;box-shadow:0 8px 24px -12px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.02) inset}
.pc.feat{border:1.5px solid var(--gold2);box-shadow:0 0 0 1px rgba(247,201,72,.25),0 10px 30px -10px rgba(247,201,72,.35)}
.pc .rib{position:absolute;top:-10px;inset-inline-start:14px;font-size:12px;font-weight:900;padding:3px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--gold2);color:var(--gold2)}
.pc.feat .rib{background:var(--gold2);color:#111;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{box-shadow:0 0 16px rgba(247,201,72,.8);transform:scale(1.04)}}
.pc .pt{display:flex;align-items:center;gap:12px}
.pc .em{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:26px;background:rgba(247,201,72,.08);border:1px solid var(--sep)}
.pc .pt b{display:block;font-size:16px;font-weight:900}
.pc .pt b.vol{font-size:22px;letter-spacing:.2px;color:var(--gold2)}.pc .pt b.vol small{font-size:13px;color:#e8e2cc;font-weight:800}
.pc .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pc .meta span{font-size:12px;font-weight:700;padding:2px 8px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--sep);color:#e8e2cc}
.pc .pp{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--sep)}
.pc .pr2{flex:1;min-width:0}
.pc .pr2 s{display:block;font-size:12px;color:var(--hint)}
.pc .pr2 strong{font-size:20px;font-weight:900;color:var(--gold2)}
.pc .pr2 strong small{font-size:12px;font-weight:700;color:var(--hint)}
.pc .off{display:inline-block;margin-inline-start:6px;font-size:11px;font-weight:900;padding:1px 7px;border-radius:8px;background:rgba(46,224,111,.14);color:var(--ok);vertical-align:3px}
.pc .buy{min-width:110px;min-height:46px;border:0;border-radius:14px;background:var(--gold2);color:#111;font-weight:900;cursor:pointer}
.pc.feat .buy{box-shadow:0 0 18px rgba(247,201,72,.45)}

/* states */
.empty{text-align:center;padding:48px 8px}
.empty .mk{width:64px;height:64px;margin:0 auto 12px;border-radius:18px;display:grid;place-items:center;font-size:30px;font-weight:900;color:var(--ink);background:linear-gradient(160deg,var(--gold1),var(--gold2))}
.empty b{display:block;font-size:16px;margin-bottom:4px}
.skel{height:200px;border-radius:20px;background:var(--bg2);animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.55}}
/* the bot's admins: every button with its text, premium emoji and colour (3.34). The preview uses Telegram's own
   chat and button colours, so it reads as the chat and not as this page */
.adm{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--sep);background:var(--bg2);color:var(--gold2);font-weight:800;font-size:13px;cursor:pointer}
.bh{display:flex;align-items:center;gap:8px;margin:4px 2px 12px}
.bh h1{font-size:18px;font-weight:900;margin:0;flex:1}
.bh .b{min-height:40px}
.tgchat{display:flex;flex-direction:column;gap:6px;padding:14px 10px;border-radius:16px;color:#f5f5f5;
 background:radial-gradient(circle at 18% 12%,rgba(80,140,200,.2),transparent 45%),radial-gradient(circle at 85% 85%,rgba(140,90,200,.18),transparent 50%),#0e1621}
.tgmsg{align-self:flex-start;max-width:86%;padding:8px 12px 6px;border-radius:14px 14px 4px 14px;background:#182533;line-height:1.6}
.tgmsg small{display:block;text-align:left;font-size:11px;opacity:.5}
.tgkb{display:grid;gap:4px}
.tgkb>button{padding:0;border:0;background:none;cursor:pointer;border-radius:10px}
.tgb{display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:6px 10px;border-radius:10px;color:#fff;font-weight:600;font-size:14px;line-height:1.35;text-align:center;background:rgba(255,255,255,.12)}
.tgb>span{overflow-wrap:anywhere;min-width:0}
.tgb.success{background:#3f9e5a}.tgb.primary{background:#3d84c6}.tgb.danger{background:#d04f4f}
.tge{display:inline-grid;place-items:center;width:20px;height:20px;flex:none;font-style:normal;font-size:15px}
.tge img{width:20px;height:20px;object-fit:contain}
.bgr{margin-top:16px}
.bgr h2{margin:0 2px 6px;font-size:14px;color:var(--hint)}
.brow{display:flex;align-items:center;gap:10px;width:100%;min-height:60px;padding:8px 10px;border:0;border-top:1px solid var(--sep);background:none;text-align:start;cursor:pointer}
.card>.brow:first-child{border-top:0}
.brow .tgb{flex:0 1 58%;min-height:38px;font-size:13px;background:#2b3a4a}
.brow .tgb.success{background:#3f9e5a}.brow .tgb.primary{background:#3d84c6}.brow .tgb.danger{background:#d04f4f}
.brow.off .tgb{opacity:.45}
.brow .bm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--hint)}

.pq-st.good{--c:var(--ok)}.pq-st.fine{--c:var(--warn)}.pq-st.bad,.pq-st.down{--c:var(--bad)}

.pq-hour{font-size:12px;color:var(--hint);margin:4px 2px 0}

.pq-line{position:relative;margin:8px 0 0;padding-inline-start:20px}
.pq-line:before{content:"";position:absolute;top:0;bottom:22px;inset-inline-start:7px;width:2px;border-radius:1px;background:color-mix(in srgb,var(--c) 45%,var(--bg3))}

var PN={i:'آیفون',a:'اندروید',w:'ویندوز'};

// the price of a custom purchase: the same as panel.js smartPrice and shop.rs price()

 if(g>=50&&+r.bulk>0)p=p*(1-Math.min(40,+r.bulk*(g>=100?2:1))/100);var rd=+r.round||1000;return Math.max(rd,Math.round(p/rd)*rd)}

 return '<div class="card" style="margin-bottom:12px"><span class="lbl" style="margin-top:0">اسم کانفیگ شما</span><input class="in" id="cn" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+esc(A.nameHint||'mahtab87')+'" value="'+esc(A.name||'')+'">'+

 else A.svc=svcs[0]||'vip';

var BGR=[['main','منوی اصلی'],['sub','زیر پیام اشتراک'],['pay','صفحه‌ی پرداخت'],['other','بقیه']];
function post(path,body){return fetch(path,{method:'POST',headers:{'X-Tg-Init':initData(),'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error(j.error||r.status);return j})})}
function backBtn(fn){var w=tg();if(!w||!w.BackButton)return;try{if(BB.back)w.BackButton.offClick(BB.back);BB.back=fn;if(fn){w.BackButton.onClick(fn);w.BackButton.show()}else w.BackButton.hide()}catch(e){}}
function bGroup(x){return x.main?'main':/^(pay_|disc$)/.test(x.key)?'pay':/اشتراک/.test(x.place)?'sub':'other'}
function bColour(x,st){st=st==null?x.style:st;return st==''?x.style_default||'':st=='none'?'':st}
// with a premium emoji the plain one at the start goes, as in the bot
function bShown(txt,icon){if(!icon)return txt;var m=String(txt).trim().match(/^(\S+)\s+(.+)$/);return m&&!/[\p{L}\p{N}]/u.test(m[1])?m[2]:txt}
function bEmo(id,big){return id?'<img alt="" src="/tg/api/admin/emoji/'+encodeURIComponent(id)+'?init='+encodeURIComponent(initData())+'" onerror="this.replaceWith(document.createTextNode(\'⭐\'))">':''}
function bBtn(x,o){o=o||{};var icon=o.icon==null?x.icon:o.icon,txt=o.text==null?(x.text||x.default):(o.text||x.default);
 return '<span class="tgb '+(bColour(x,o.style)||'')+'">'+(icon?'<i class="tge">'+bEmo(icon)+'</i>':'')+'<span>'+esc(bShown(txt,icon))+'</span></span>'}

 if(!BB.d){el.innerHTML='<div class="skel"></div>';bLoad().then(drawBtns).catch(function(){empty('!','باز نشد','دوباره امتحان کنید.')});return}
 backBtn(A.list.length||sales()?function(){A.view='acc';render()}:null);
 var l=BB.d.buttons,main=l.filter(function(x){return x.main&&!x.hidden});
 var h='<div class="bh"><h1>مدیریت دکمه‌ها</h1><button class="b" id="bprev">نمونه توی چت</button></div>'+
  '<p class="lead">منوی اصلی همین‌طور به مشتری نشان داده می‌شه. روی هر دکمه بزنید تا متن، ایموجی پریمیوم و رنگش رو عوض کنید.</p>'+
  '<div class="tgchat"><div class="tgmsg">به ربات فروش خوش آمدید 🌟<small>12:00</small></div><div class="tgkb">'+main.map(function(x){return '<button data-bk="'+x.key+'">'+bBtn(x)+'</button>'}).join('')+'</div></div>';

 h+='<p class="lead" style="margin-top:16px">ایموجی پریمیوم روی دکمه‌ها وقتی دیده می‌شه که حسابی که ربات رو توی BotFather ساخته، تلگرام پریمیوم داشته باشه.</p>';
 el.innerHTML=h;
 Array.prototype.slice.call(document.querySelectorAll('[data-bk]')).forEach(function(b){b.onclick=function(){BB.k=b.dataset.bk;BB.f=null;A.view='btn';render();window.scrollTo(0,0)}});
 document.getElementById('bprev').onclick=function(){var b=this;b.disabled=true;api('/tg/api/admin/preview').then(function(){b.disabled=false;buzz('success');toast('همه‌ی دکمه‌ها توی چت فرستاده شد')}).catch(function(e){b.disabled=false;buzz('error');toast('تلگرام قبول نکرد: '+e.message)})}}
function drawBtn(){var x=bFind(BB.k);if(!x){A.view='btns';return render()}
 var f=BB.f||(BB.f={text:x.text,icon:x.icon,style:x.style,hidden:x.hidden});
 backBtn(function(){bStop();A.view='btns';render()});
 var cols=[['','پیش‌فرض',x.style_default||''],['success','سبز','success'],['primary','آبی','primary'],['danger','قرمز','danger'],['none','ساده','']];
 var h='<div class="bed"><div class="bh"><h1>ویرایش دکمه</h1></div><p class="lead">'+esc(x.place)+'</p>'+
  '<div class="tgchat"><div class="tgkb" id="blive"></div></div>'+
  '<span class="lbl">متن دکمه</span><div class="bin"><input class="in" id="bt" maxlength="60" value="'+esc(f.text)+'" placeholder="'+esc(x.default)+'"><button class="b" id="bdef">پیش‌فرض</button></div><span class="bcnt" id="bc"></span>'+
  '<span class="lbl">ایموجی پریمیوم</span><div class="bemo"><span class="pic">'+(f.icon?bEmo(f.icon):'—')+'</span>'+
   (BB.poll?'':'<button class="b main" id="bask">'+(f.icon?'عوض کردن ایموجی':'گذاشتن ایموجی پریمیوم')+'</button>')+(f.icon&&!BB.poll?'<button class="b" id="brm" style="flex:0 0 auto">حذف</button>':'')+'</div>'+
  (BB.poll?'<div class="bwait"><b>ربات توی چت منتظر ایموجیه</b>مینی‌اپ رو پایین بکشید (کوچیک کنید)، یک ایموجی پریمیوم توی چت ربات بفرستید و برگردید؛ این‌جا خودش عوض می‌شه. <button class="b" id="bstop" style="min-height:36px;margin-top:6px">انصراف</button></div>':'')+
  (x.style_key?'<span class="lbl">رنگ</span><div class="bcol">'+cols.map(function(c){return '<button data-c="'+c[0]+'" class="'+(f.style==c[0]?'on':'')+'"><i class="'+c[2]+'"></i>'+c[1]+'</button>'}).join('')+'</div>'+
   (x.style_key!=x.key?'<p class="lead" style="margin:6px 2px 0">این رنگ بین دکمه‌های هم‌گروه مشترکه.</p>':''):'')+
  (x.main?'<label class="btog"><b>نمایش در منوی اصلی</b><input type="checkbox" id="bhid"'+(f.hidden?'':' checked')+'></label>':'')+
  '<div class="bsave"><button class="b" id="bcan">انصراف</button><button class="b main" id="bok">ذخیره</button></div></div>';
 document.getElementById('app').innerHTML=h;
 var $=function(s){return document.querySelector(s)};

 $('#bt').oninput=function(){f.text=this.value;live()};
 $('#bdef').onclick=function(){f.text='';$('#bt').value='';live()};
 Array.prototype.slice.call(document.querySelectorAll('[data-c]')).forEach(function(b){b.onclick=function(){f.style=b.dataset.c;drawBtn()}});
 var hd=$('#bhid');if(hd)hd.onchange=function(){f.hidden=!hd.checked};
 var rm=$('#brm');if(rm)rm.onclick=function(){f.icon='';drawBtn()};
 var st=$('#bstop');if(st)st.onclick=function(){bStop();drawBtn()};
 var ask=$('#bask');if(ask)ask.onclick=function(){ask.disabled=true;var was=x.icon;
  api('/tg/api/admin/ask?key='+encodeURIComponent(x.key)).then(function(){buzz('success');var n=0;
   BB.poll=setInterval(function(){if(++n>60){bStop();drawBtn();return}
    bLoad().then(function(){var y=bFind(x.key);if(y&&y.icon&&y.icon!=was){bStop();f.icon=y.icon;buzz('success');toast('ایموجی پریمیوم ذخیره شد');drawBtn()}}).catch(function(){})},2000);drawBtn()})
  .catch(function(e){ask.disabled=false;buzz('error');toast(e.message=='the bot is off'?'ربات الان روشن نیست':'ربات نتونست توی چت پیام بده')})};
 $('#bcan').onclick=function(){bStop();A.view='btns';render()};
 $('#bok').onclick=function(){var b=this,o={};o[x.key]={text:(f.text||'').trim(),icon:f.icon||'',hidden:!!f.hidden};if(x.style_key)o[x.key].style=f.style;b.disabled=true;
  post('/tg/api/admin/buttons',{buttons:o}).then(function(d){BB.d=d;bStop();buzz('success');toast('ذخیره شد');A.view='btns';render();window.scrollTo(0,0)}).catch(function(e){b.disabled=false;buzz('error');toast(e.message)})}}
function bStop(){clearInterval(BB.poll);BB.poll=0}

// ---- the bot's admins: path quality (read-only) and the path alerts switch (3.36)
var PQ={d:null,t:0,busy:false};
var PQS={good:'خوب',fine:'قابل قبول',bad:'پر افت',down:'قطع',wait:'منتظر داده'};
function pqNum(x){x=+x||0;return fa(x%1?x.toFixed(1):String(x))}
function pqAgo(at){if(!at)return 'هنوز سنجشی نرسیده';var s=Math.max(0,Math.round(Date.now()/1000-at));return s<60?'آخرین سنجش '+fa(s)+' ثانیه پیش':'آخرین سنجش '+fa(Math.round(s/60))+' دقیقه پیش'}
function pqLoad(){if(PQ.busy)return Promise.resolve();PQ.busy=true;return api('/tg/api/admin/paths').then(function(d){PQ.d=d;PQ.busy=false}).catch(function(e){PQ.busy=false;throw e})}
function pqStop(){clearInterval(PQ.t);PQ.t=0}
function drawPaths(){var el=document.getElementById('app');
 if(!PQ.d){el.innerHTML='<div class="skel"></div>';pqLoad().then(drawPaths).catch(function(){empty('!','باز نشد','دوباره امتحان کنید.')});return}
 backBtn(A.list.length||sales()?function(){pqStop();A.view='acc';render()}:null);
 // the numbers come once a minute from each tunnel: the page follows by itself while it is open
 if(!PQ.t)PQ.t=setInterval(function(){if(A.view!='paths')return pqStop();pqLoad().then(drawPaths).catch(function(){})},30000);
 var d=PQ.d,sv=d.servers||[],c={good:0,fine:0,bad:0,down:0};
 sv.forEach(function(x){if(x.state in c)c[x.state]++});
 var h='<div class="pq-top"><h1>وضعیت مسیرها</h1><button class="pq-re" id="pqre" aria-label="تازه کردن">تازه کن</button></div>'+
  '<p class="lead">'+pqAgo(d.last)+' · عددها میانگین '+fa(d.limits.window_min)+' دقیقهٔ اخیرند</p>'+
  '<div class="pq-sum"><div><b style="color:var(--ok)">'+fa(c.good)+'</b><small>خوب</small></div><div><b style="color:var(--warn)">'+fa(c.fine)+'</b><small>قابل قبول</small></div><div><b style="color:var(--bad)">'+fa(c.bad)+'</b><small>پر افت</small></div><div><b style="color:var(--bad)">'+fa(c.down)+'</b><small>قطع</small></div></div>'+
  '<button class="pq-alert'+(d.alerts?' on':'')+'" id="pqal" role="switch" aria-checked="'+!!d.alerts+'"><span><b>هشدار مسیر پر افت</b><small>'+(d.alerts?'وقتی مسیری پر افت شد یا خوب شد، ربات پیام می‌ده':'خاموش؛ ربات برای مسیرها پیام نمی‌ده')+'</small><small>آفلاین و آنلاین شدن سرورها همیشه خبر داده می‌شه</small></span><i class="pq-sw"></i></button>';
 if(!sv.length)h+='<div class="card"><p class="muted" style="margin:0">هنوز تانلی نیست.</p></div>';
 sv.forEach(function(x){var n=x.now,hr=x.hour;
  h+='<section class="pq-st '+x.state+'"><div class="pq-hd"><span class="fl">'+(x.flag||'🌐')+'</span><b>'+esc(x.name)+'</b><span class="pq-pill">'+PQS[x.state]+'</span></div>';
  if(n)h+='<div class="pq-nums"><div><small>پینگ</small><strong class="ltr">'+pqNum(n.ping)+'<em>ms</em></strong></div><div><small>افت</small><strong class="ltr">'+pqNum(n.loss)+'<em>%</em></strong></div><div><small>لرزش</small><strong class="ltr">'+pqNum(n.jit)+'<em>ms</em></strong></div></div>';
  if(hr)h+='<p class="pq-hour">ساعت گذشته: افت '+pqNum(hr.loss)+'٪ · لرزش '+pqNum(hr.jit)+' · بدترین پینگ '+pqNum(hr.max)+'</p>';
  h+='<div class="pq-line">'+x.tunnels.map(function(t){var a=t.now,st=!t.up?'down':a?a.level:'wait';
   return '<div class="pq-tu '+st+'"><div class="pq-r1"><b class="ltr">'+esc(t.name)+'</b><span class="from">از '+esc(t.from)+'</span>'+
    '<span class="chips">'+(t.lanes>0?'<span class="pq-chip ln">بی‌ترتیب</span>':'')+'<span class="pq-chip ltr">'+esc(t.transport)+'</span></span></div>'+
    '<div class="pq-r2">'+(!t.up?'<span class="cut">قطع است</span>':a?'<span>پینگ <strong class="ltr">'+pqNum(a.ping)+'</strong></span><span>افت <strong class="ltr">'+pqNum(a.loss)+'٪</strong></span><span>لرزش <strong class="ltr">'+pqNum(a.jit)+'</strong></span>':'<span>داده در راه است</span>')+'</div></div>'}).join('')+'</div></section>'});
 h+='<p class="pq-foot">هر دقیقه ۲۰ بستهٔ کوچک داخل هر تانل رفت و برگشت می‌کند. پینگ: میانه · افت: بسته‌ای که تا ۱ ثانیه برنگشت · لرزش: تغییر پینگ از هر بسته به بعدی. «بی‌ترتیب»: بستهٔ بازی پشت بستهٔ گم‌شده نمی‌ماند. پر افت یعنی افت بالای '+fa(d.limits.bad_loss)+'٪ یا لرزش بالای '+fa(d.limits.bad_jit)+'ms.</p>';
 el.innerHTML=h;
 document.getElementById('pqre').onclick=function(){var b=this;b.disabled=true;pqLoad().then(function(){buzz('success');drawPaths()}).catch(function(){b.disabled=false;buzz('error');toast('نشد، دوباره امتحان کنید')})};
 document.getElementById('pqal').onclick=function(){var b=this;b.disabled=true;post('/tg/api/admin/paths',{alerts:!d.alerts}).then(function(n){PQ.d=n;buzz('success');toast(n.alerts?'هشدار مسیرها روشن شد':'هشدار مسیرها خاموش شد');drawPaths()}).catch(function(){b.disabled=false;buzz('error');toast('ذخیره نشد')})}}

function start(){var w=tg();if(w){try{w.ready();w.expand()}catch(e){}
  // the same black as the page above and below it
  try{w.setHeaderColor('#170a10');w.setBackgroundColor('#170a10');if(w.setBottomBarColor)w.setBottomBarColor('#170a10')}catch(e){}}
 var p=(w&&w.platform)||'';A.plat=/ios|macos/.test(p)?'i':/tdesktop|windows|weba|webk/.test(p)?'w':'a';
 if(!initData())return empty('K','این صفحه رو از ربات باز کنید','مینی‌اپ کانکی فقط از داخل ربات تلگرام باز می‌شه.');
 Promise.all([api('/tg/api/me'),api('/tg/api/shop').catch(function(){return null})]).then(function(r){A.list=r[0].accounts||[];if(A.renew&&!A.list.some(function(x){return x.id==A.renew}))A.renew=0;A.orders=r[0].orders||[];A.needName=!!r[0].need_name;A.trial=!!r[0].trial;A.androidApp=!!r[0].android_app;A.appLink=r[0].app_link||'';A.winLink=r[0].win_link||'';A.nameHint=r[0].name_hint||'';A.support=r[0].support||'';A.admin=!!r[0].admin;A.shop=r[1];render()}).catch(function(e){empty('!','باز نشد',e.message=='open this page from the bot'?'این صفحه رو از ربات باز کنید.':'اتصال برقرار نشد؛ کمی بعد دوباره باز کنید.')})}
// wait a moment for Telegram's script, then go on without it
var n=0;(function go(){if(tg()||n++>15)start();else setTimeout(go,100)})();
})();
