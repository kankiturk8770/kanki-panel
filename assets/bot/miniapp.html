<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حساب کانکی</title>
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<style>
@font-face{font-family:Vazirmatn;src:url(/assets/vazirmatn.woff) format("woff");font-weight:100 900;font-display:swap}
:root{
 --bg:var(--tg-theme-bg-color,#0f0d0a);--bg2:var(--tg-theme-secondary-bg-color,#1a1712);--tx:var(--tg-theme-text-color,#f3eee4);
 --hint:var(--tg-theme-hint-color,#9a9284);--link:var(--tg-theme-link-color,#e2b54e);--btn:var(--tg-theme-button-color,#d6a43c);
 --btx:var(--tg-theme-button-text-color,#1a1206);--sep:color-mix(in srgb,var(--hint) 28%,transparent);
 --gold1:#ffe9a6;--gold2:#d6a43c;--gold3:#8a5f17;--ink:#1a1206;
 --ok:#2fb36d;--warn:#d9a21b;--bad:#e0533d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 Vazirmatn,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate}
.hide{display:none!important}
.muted{color:var(--hint)}

/* account switcher */
.accs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.accs button{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--sep);background:var(--bg2);cursor:pointer;font-weight:700}
.accs button.on{border-color:var(--gold2);color:var(--gold2)}

/* the pass: the one bold thing on the page */
.pass{position:relative;border-radius:20px;overflow:hidden;color:var(--ink);
 background:linear-gradient(160deg,var(--gold1) 0%,var(--gold2) 58%,#b98226 100%);
 box-shadow:0 10px 30px -14px color-mix(in srgb,var(--gold2) 70%,transparent)}
.pass .top{padding:16px 16px 14px}
.pass .who{display:flex;align-items:center;gap:8px}
.pass .who b{font-size:20px;font-weight:900;letter-spacing:.2px}
.pass .st{margin-inline-start:auto;font-size:12px;font-weight:800;padding:2px 10px;border-radius:10px;background:rgba(26,18,6,.14)}
.pass .st i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:0}
.pass .big{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.pass .big small{display:block;font-size:12px;font-weight:700;opacity:.72}
.pass .big strong{display:block;font-size:24px;font-weight:900;line-height:1.25}
.pass .big em{font-style:normal;font-size:13px;font-weight:700;opacity:.8}
.pass .bar{height:6px;border-radius:3px;background:rgba(26,18,6,.16);margin-top:12px;overflow:hidden}
.pass .bar span{display:block;height:100%;background:var(--ink);border-radius:3px}
/* the tear line between the pass and its stub */
.pass .tear{position:relative;height:0;border-top:2px dashed rgba(26,18,6,.32);margin:0 14px}
.pass .tear:before,.pass .tear:after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.pass .tear:before{right:-25px}.pass .tear:after{left:-25px}
.pass .stub{padding:12px 16px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pass .routes{display:flex;gap:6px;flex-wrap:wrap;font-size:16px}
.pass .routes span{padding:2px 8px;border-radius:10px;background:rgba(26,18,6,.1)}
.pass .copy{margin-inline-start:auto;min-height:40px;padding:0 14px;border:0;border-radius:12px;background:var(--ink);color:var(--gold1);font-weight:800;cursor:pointer}

/* sections */
h2{font-size:16px;font-weight:900;margin:24px 2px 4px}
.lead{margin:0 2px 12px;color:var(--hint);font-size:13px}
.card{background:var(--bg2);border-radius:16px;padding:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--bg)}
.seg button{min-height:40px;border:0;border-radius:10px;background:transparent;font-weight:700;cursor:pointer;color:var(--hint)}
.seg button.on{background:var(--bg2);color:var(--tx);box-shadow:0 0 0 1px var(--sep)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts.one{grid-template-columns:1fr}
.b{min-height:44px;border-radius:12px;border:1px solid var(--sep);background:transparent;font-weight:800;cursor:pointer;padding:0 12px}
.b.main{border:0;background:var(--btn);color:var(--btx)}
.b:disabled{opacity:.5}
.steps{margin:12px 2px 0;padding:0;list-style:none;counter-reset:s;font-size:13px;color:var(--hint)}
.steps li{counter-increment:s;display:flex;gap:8px;margin:4px 0}
.steps li:before{content:counter(s,persian);flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--bg);color:var(--tx)}

.row{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 4px}
.row+.row{border-top:1px solid var(--sep)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:800}
.row .nm b.sn{text-align:right}
.row .nm small{display:block;font-size:12px;color:var(--hint)}
.row .fl{font-size:18px;flex:none;min-width:52px;text-align:center}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.tags span{font-size:12px;padding:0 8px;line-height:20px;border-radius:8px;border:1px solid var(--sep);color:var(--hint)}
.row .b{flex:none;min-height:40px}

/* the two views */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--bg2);margin:0 0 12px}
.tabs button{min-height:40px;border:0;border-radius:10px;background:transparent;font-weight:800;cursor:pointer;color:var(--hint)}
.tabs button.on{background:var(--bg);color:var(--tx);box-shadow:0 0 0 1px var(--sep)}

/* custom purchase */
.vol{display:flex;align-items:center;gap:12px;justify-content:center;margin:4px 0 8px}
.vol .n{min-width:132px;text-align:center}
.vol .n strong{display:block;font-size:20px;font-weight:900;line-height:1.2}
.vol .n strong span{font-size:32px}
.vol .n small{font-size:12px;color:var(--hint)}
.step{width:44px;height:44px;border-radius:14px;border:1px solid var(--sep);background:var(--bg);font-size:20px;font-weight:900;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--gold2);height:32px;margin:0}
.lbl{display:block;font-size:13px;font-weight:800;margin:12px 2px 6px}
.chips2{display:flex;gap:6px;flex-wrap:wrap}
.chips2 button{flex:1 0 auto;min-height:40px;min-width:64px;padding:0 12px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);font-weight:700;cursor:pointer}
.chips2 button.on{border-color:var(--gold2);background:color-mix(in srgb,var(--gold2) 16%,var(--bg));color:var(--tx)}
.total{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:12px;border-top:1px dashed var(--sep)}
.total .p{flex:1}
.total .p small{display:block;font-size:12px;color:var(--hint)}
.total .p strong{font-size:20px;font-weight:900}
.b.go{border:0;background:var(--ok);color:#fff;min-width:150px}

/* listed plans: the stripe is the colour of the plan's button in the bot */
.plan{display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--bg2);margin-bottom:8px;border-inline-start:4px solid var(--sep)}
.plan.success{border-inline-start-color:var(--ok)}.plan.primary{border-inline-start-color:#3b8be0}.plan.danger{border-inline-start-color:var(--bad)}
.plan .nm{flex:1;min-width:0}
.plan .nm b{display:block;font-weight:800}
.plan .nm small{display:block;font-size:12px;color:var(--hint)}
.plan .pr{text-align:left;font-weight:900;white-space:nowrap}
.plan .b{min-height:40px;flex:none}
.cat{font-size:13px;font-weight:800;color:var(--hint);margin:16px 2px 8px}

/* config name, trial, orders */
.in{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);color:var(--tx);font:inherit;padding:0 12px;direction:ltr;text-align:left}
.in:focus{outline:2px solid var(--gold2);outline-offset:1px}
.b.blue{border:0;background:#3b8be0;color:#fff}
.ost{font-size:12px;font-weight:800;padding:2px 10px;border-radius:10px;white-space:nowrap}
.ost.g{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.ost.y{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.ost.r{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}

/* states */
.empty{text-align:center;padding:48px 8px}
.empty .mk{width:64px;height:64px;margin:0 auto 12px;border-radius:18px;display:grid;place-items:center;font-size:30px;font-weight:900;color:var(--ink);background:linear-gradient(160deg,var(--gold1),var(--gold2))}
.empty b{display:block;font-size:16px;margin-bottom:4px}
.skel{height:200px;border-radius:20px;background:var(--bg2);animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.55}}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:12px 14px;border-radius:12px;background:var(--tx);color:var(--bg);font-weight:700;text-align:center;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.skel{animation:none}#toast{transition:none}}
@media (min-width:620px){body{max-width:560px;margin:0 auto}}
</style>
</head>
<body>
<div id="app"><div class="skel"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
var Q=new URLSearchParams(location.search);
var A={list:[],cur:0,plat:'i',view:Q.get('buy')?'buy':'acc',shop:null,renew:+(Q.get('renew')||0),cb:null};
function tg(){return window.Telegram&&Telegram.WebApp}
// the signed init data: from Telegram's script, else from the page address (the script may not load in Iran)
function initData(){var w=tg();if(w&&w.initData)return w.initData;
 var h=location.hash.slice(1),m=h.match(/(?:^|&)tgWebAppData=([^&]*)/);return m?decodeURIComponent(m[1]):''}
function fa(n){return String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function flag(cc){cc=(cc||'').toUpperCase();if(!/^[A-Z]{2}$/.test(cc))return '';return String.fromCodePoint(0x1F1E6+cc.charCodeAt(0)-65,0x1F1E6+cc.charCodeAt(1)-65)}
function route(s){var to=flag(s.cc)||'🌐';return s.iran?flag('IR')+'→'+to:to}
function gb(x){return x>=100?fa(Math.round(x)):fa((Math.round(x*10)/10).toString())}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},2600)}
function buzz(k){var w=tg();try{w&&w.HapticFeedback&&w.HapticFeedback.notificationOccurred(k)}catch(e){}}
function api(path){return fetch(path,{headers:{'X-Tg-Init':initData()},cache:'no-store'}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok){var e=new Error(j.error||r.status);e.why=j.why;throw e}return j})})}
var PN={i:'آیفون',a:'اندروید',w:'ویندوز'};
var ST={Active:['فعال','var(--ok)'],Limited:['حجم تمام شده','var(--warn)'],Expired:['زمان تمام شده','var(--warn)'],Disabled:['غیرفعال','var(--bad)']};

function toman(n){return fa(Math.round(n).toLocaleString('en-US')).replace(/,/g,'٬')+' تومان'}
// the price of a custom purchase: the same as panel.js smartPrice and shop.rs price()
function price(r,g,days,conns){var m=Math.max(1,days/30),p=(+r.base||0)*m+g*(+r.gb||0)+Math.max(0,conns-1)*(+r.conn||0)*m;
 if(g>=50&&+r.bulk>0)p=p*(1-Math.min(40,+r.bulk*(g>=100?2:1))/100);var rd=+r.round||1000;return Math.max(rd,Math.round(p/rd)*rd)}
function dur(d){return d%30?fa(d)+' روز':(d==30?'یک ماه':fa(d/30)+' ماه')}
var OST={pending:['در انتظار تأیید','y'],waiting:['در انتظار پرداخت','y'],approved:['تأیید شد','g'],done:['فعال شد','g'],rejected:['رد شد','r'],error:['خطا؛ پشتیبانی پیگیری می‌کنه','r'],expired:['پرداخت نشد؛ منقضی شد','r']};
function ordersHtml(){if(!A.orders||!A.orders.length)return '';
 return '<h2>سفارش‌های من</h2><div class="card">'+A.orders.map(function(o){var st=OST[o.status]||[o.status||'—','y'],amt=+o.amount;
  return '<div class="row"><div class="nm"><b>'+esc(o.plan||'سفارش')+'</b><small>'+(o.kind=='renew'?'تمدید':'خرید')+'، '+(amt>0&&o.method!='np'&&o.method!='wallet'?toman(amt):'')+(o.created?' '+new Date(o.created*1000).toLocaleDateString('fa-IR'):'')+'</small></div><span class="ost '+st[1]+'">'+st[0]+'</span></div>'}).join('')+'</div>'}
function nameCard(){if(!A.needName||A.renew)return '';
 return '<div class="card" style="margin-bottom:12px"><span class="lbl" style="margin-top:0">اسم کانفیگ شما</span><input class="in" id="cn" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="mahtab87" value="'+esc(A.name||'')+'">'+
  '<p class="lead" style="margin:6px 2px 0">فقط حروف انگلیسی و عدد، ۳ تا ۱۲ حرف، اولش حرف. توی برنامه با همین اسم می‌بینیدش.</p></div>'}
function nameQ(){if(!A.needName||A.renew)return '';var e=document.getElementById('cn'),v=e?e.value.trim():'';A.name=v;return '&name='+encodeURIComponent(v)}
var NOSEND='ربات نتونست توی چت پیام بده؛ ربات رو توی تلگرام استارت کنید (اگه بلاکش کردید، آنبلاک) و دوباره امتحان کنید';
function why(e,j){var m=e.message;if(m=='name')return 'اول اسم کانفیگ رو بنویسید';if(m=='bad name')return (j||'اسم کانفیگ درست نیست').replace(/<[^>]+>/g,'').split('\n')[0];
 if(m=='join the channel')return 'اول عضو کانال بشید؛ ربات لینکش رو توی چت فرستاد';if(m=='the bot is off')return 'ربات الان در دسترس نیست؛ کمی بعد امتحان کنید';
 if(m=='sales are off')return 'فروش فعلاً بسته است';if(m=='not delivered')return NOSEND;if(m=='no trial')return 'تست رایگان قبلاً گرفته شده';return 'نشد، دوباره امتحان کنید'}
function empty(icon,title,text,btn){document.getElementById('app').innerHTML='<div class="empty"><div class="mk">'+icon+'</div><b>'+title+'</b><p class="muted">'+text+'</p>'+(btn||'')+'</div>'}

function tabs(){if(!A.shop||(!A.shop.custom.on&&!A.shop.plans.length)||!A.shop.sales)return '';
 return '<div class="tabs" role="tablist"><button role="tab" data-v="acc" class="'+(A.view=='acc'?'on':'')+'">حساب من</button><button role="tab" data-v="buy" class="'+(A.view=='buy'?'on':'')+'">خرید و تمدید</button></div>'}
function render(){if(A.view=='buy'&&A.shop&&A.shop.sales)return drawBuy();if(!A.list.length)return A.shop&&A.shop.sales?(A.view='buy',drawBuy()):noAccount();draw()}
function noAccount(){empty('K','هنوز اشتراکی ندارید','بعد از خرید اشتراک، اطلاعات حساب و کانفیگ‌ها اینجا دیده می‌شن.','<button class="b main" style="min-width:180px" onclick="window.Telegram&&Telegram.WebApp&&Telegram.WebApp.close()">برگشت به ربات</button>')}
function wireTabs(){Array.prototype.slice.call(document.querySelectorAll('[data-v]')).forEach(function(b){b.onclick=function(){A.view=b.dataset.v;render()}})}

function drawBuy(){var sh=A.shop,c=sh.custom,mine=A.list.filter(function(x){return x.id==A.renew})[0],h=(A.list.length?tabs():'');
 h+=nameCard();
 if(A.trial&&!mine)h+='<div class="card" style="margin-bottom:12px;display:flex;align-items:center;gap:12px"><div style="flex:1"><b>🎁 تست رایگان</b><p class="lead" style="margin:2px 0 0">قبل از خرید امتحان کنید؛ یک بار برای هر نفر.</p></div><button class="b blue" id="tri">گرفتن تست</button></div>';
 if(mine)h+='<p class="lead" style="margin:0 2px 12px">تمدید حساب <b class="ltr">'+esc(mine.name)+'</b>: حجم و روز به همین حساب اضافه می‌شه. <button class="b" id="nr" style="min-height:40px;margin-inline-start:6px">خرید حساب تازه</button></p>';
 if(c.on){var cb=A.cb||(A.cb={g:Math.min(c.max_gb,Math.max(c.min_gb,30)),d:c.days[0],u:1});
  // renewing: never fewer users than the account has (a renewal raises it, never lowers it)
  var from=mine?Math.max(1,Math.min(c.users,mine.connections||1)):1;if(cb.u<from)cb.u=from;
  var users=[];for(var i=from;i<=c.users;i++)users.push(i);
  h+='<h2 style="margin-top:4px">حجم و روز دلخواه</h2><p class="lead">هر چقدر لازم دارید انتخاب کنید؛ قیمت همین‌جا حساب می‌شه.</p><div class="card">'+
   '<div class="vol"><button class="step" id="gm" aria-label="کمتر">−</button><div class="n"><strong><span id="gv">'+fa(cb.g)+'</span> گیگ</strong><small>از '+fa(c.min_gb)+' تا '+fa(c.max_gb)+' گیگ</small></div><button class="step" id="gp" aria-label="بیشتر">+</button></div>'+
   '<input type="range" id="gr" min="'+c.min_gb+'" max="'+c.max_gb+'" step="1" value="'+cb.g+'" aria-label="حجم">'+
   '<span class="lbl">مدت</span><div class="chips2" id="dd">'+c.days.map(function(d){return '<button data-d="'+d+'" class="'+(cb.d==d?'on':'')+'">'+dur(d)+'</button>'}).join('')+'</div>'+
   (users.length>1?'<span class="lbl">تعداد کاربر (دستگاه هم‌زمان)</span><div class="chips2" id="uu">'+users.map(function(n){return '<button data-u="'+n+'" class="'+(cb.u==n?'on':'')+'">'+fa(n)+' کاربره</button>'}).join('')+'</div>':'')+
   '<div class="total"><div class="p"><small>قیمت</small><strong id="tp">'+toman(price(c.rules,cb.g,cb.d,cb.u))+'</strong></div><button class="b go" id="cbuy">ادامه و پرداخت</button></div></div>'}
 if(sh.plans.length){h+='<h2>پلن‌ها</h2>';var cats=[];sh.plans.forEach(function(p){if(cats.indexOf(p.category)<0)cats.push(p.category)});
  cats.forEach(function(k){if(cats.length>1)h+='<div class="cat">'+esc(k||'سایر پلن‌ها')+'</div>';
   sh.plans.filter(function(p){return p.category==k}).forEach(function(p){var st=p.style&&p.style!='none'?p.style:(p.style=='none'?'':(p.conns>=2?'success':'primary'));
    h+='<div class="plan '+st+'"><div class="nm"><b>'+esc(p.name)+'</b><small>'+(p.gb>0?fa(p.gb)+' گیگ':'نامحدود')+'، '+dur(p.days)+'، '+fa(p.conns)+' کاربره</small></div><span class="pr">'+toman(p.toman)+'</span><button class="b" data-pid="'+p.id+'">خرید</button></div>'})})}
 if(!A.list.length)h+=ordersHtml();
 if(!c.on&&!sh.plans.length)h+='<div class="empty"><b>فعلاً پلنی برای فروش نیست</b><p class="muted">کمی بعد دوباره سر بزنید یا به پشتیبانی پیام بدید.</p></div>';
 document.getElementById('app').innerHTML=h;wireTabs();wireBuy()}

function wireBuy(){var $=function(s){return document.querySelector(s)},all=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))},c=A.shop.custom,cb=A.cb;
 var nr=$('#nr');if(nr)nr.onclick=function(){A.renew=0;drawBuy()};
 function upd(){if(!cb)return;var g=$('#gv'),r=$('#gr'),p=$('#tp');if(g)g.textContent=fa(cb.g);if(r&&+r.value!=cb.g)r.value=cb.g;if(p)p.textContent=toman(price(c.rules,cb.g,cb.d,cb.u))}
 var step=function(k){var s=cb.g<50?5:cb.g<100?10:25;cb.g=Math.min(c.max_gb,Math.max(c.min_gb,cb.g+k*s));upd()};
 if($('#gm')){$('#gm').onclick=function(){step(-1)};$('#gp').onclick=function(){step(1)};$('#gr').oninput=function(){cb.g=+this.value;upd()}}
 all('[data-d]').forEach(function(b){b.onclick=function(){cb.d=+b.dataset.d;all('[data-d]').forEach(function(x){x.classList.toggle('on',x==b)});upd()}});

 }
 if(u.links){var nl=u.links.trim().split('\n').length-1,L=function(x){return '<bdi class="ltr">'+x+'</bdi>'};

   a:[['v2rayNG','گوگل‌پلی'],['دکمه‌ی ➕ بالای صفحه ← '+L('Import config from Clipboard')],['منوی ☰ ← '+L('Subscription group setting')+' ← ➕، لینک خط اول رو توی '+L('URL')+' بذارید و ذخیره کنید؛ بعد منوی ⋮ ← '+L('Update subscription')],['یه کانفیگ رو انتخاب کنید و دکمه‌ی ▶ پایین صفحه رو بزنید.']],
   w:[['v2rayN','GitHub'],['منوی '+L('Servers')+' ← '+L('Import bulk URL from clipboard')+' (یا '+L('Ctrl+V')+')'],['منوی '+L('Subscription group')+' ← '+L('Subscription group settings')+' ← '+L('Add')+'، لینک خط اول رو بذارید؛ بعد '+L('Update subscription')],['روی یه سرور دابل‌کلیک کنید و '+L('System proxy')+' رو روی '+L('Set system proxy')+' بذارید.']]}[A.plat]||[];
  h+='<h2>همه‌ی لینک‌ها</h2><p class="lead">خط اول لینک اشتراکه، بعد همه‌ی کانفیگ‌های Xray و Hysteria2 ('+fa(nl)+' کانفیگ).</p>'+

 Promise.all([api('/tg/api/me'),api('/tg/api/shop').catch(function(){return null})]).then(function(r){A.list=r[0].accounts||[];if(A.renew&&!A.list.some(function(x){return x.id==A.renew}))A.renew=0;A.orders=r[0].orders||[];A.needName=!!r[0].need_name;A.trial=!!r[0].trial;A.shop=r[1];render()}).catch(function(e){empty('!','باز نشد',e.message=='open this page from the bot'?'این صفحه رو از ربات باز کنید.':'اتصال برقرار نشد؛ کمی بعد دوباره باز کنید.')})}
