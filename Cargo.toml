[package]
name = "kanki-panel"
version = "3.7.1"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
rand = "0.8"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# tunnel engine (Kanki Tunnel)
x25519-dalek = "2"
chacha20poly1305 = "0.10"
chacha20 = "0.9"
hkdf = "0.12"
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# public CA roots for the pinned clients (a CA-valid certificate needs no pin)
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.13"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
tokio_kcp = "0.9"
# game transport: Reed-Solomon FEC over KCP datagrams
reed-solomon-simd = "3.0.1"
# faketcp transport: raw IP/TCP packet crafting (udp2raw style)
libc = "0.2"
h2 = "0.4"
http = "1"
bytes = "1"
# emergency chat server (signing + serving axum over TLS)
ring = "0.17"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
