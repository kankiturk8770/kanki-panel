# Deletes the old Actions runs (and their logs) of this repository. Only by hand (Actions › Clean old runs › Run).
# Kept: the newest finished run of each workflow, and any run still going.
name: Clean old runs
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Delete old runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          gh api "repos/$REPO/actions/workflows" --jq '.workflows[].id' > "$tmp/wf"
          : > "$tmp/keep"
          while read -r w; do
            gh api "repos/$REPO/actions/workflows/$w/runs?per_page=1&status=completed" --jq '.workflow_runs[0].id // empty' >> "$tmp/keep"
          done < "$tmp/wf"
          gh api --paginate "repos/$REPO/actions/runs?per_page=100&status=completed" --jq '.workflow_runs[].id' > "$tmp/all"
          n=0
          while read -r id; do
            if grep -qx "$id" "$tmp/keep"; then continue; fi
            gh api -X DELETE "repos/$REPO/actions/runs/$id"
            n=$((n + 1))
          done < "$tmp/all"
          echo "Deleted $n runs; kept $(wc -l < "$tmp/keep") (the newest of each workflow)."
