name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tunnel tests (a real entry and exit on this machine, TCP and UDP)
        run: cargo test -- --nocapture --test-threads=4

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          cp target/release/kanki-panel kanki-panel
          sha256sum kanki-panel > kanki-panel.sha256
          grep -m1 '^version' Cargo.toml | cut -d'"' -f2 > version.txt
          cat version.txt

      - name: Publish to Releases (tag "latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kanki Panel (latest)
          make_latest: true
          files: |
            kanki-panel
            kanki-panel.sha256
            version.txt
