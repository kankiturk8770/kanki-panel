name: build

on:
  push:
    # every branch is built and tested; only main publishes a release (servers update from it)
    branches: ['**']
  workflow_dispatch:

# read only: the build of any branch cannot touch the release; only the publish job below (main) may write
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # KANKI MIX server (Go, src/vpn/kmix-server): tested, then built into assets/bin, so the panel
      # always carries the server made from the source in this repository
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache-dependency-path: src/vpn/kmix-server/go.sum

      - name: KANKI MIX server
        run: |
          cd src/vpn/kmix-server
          go vet ./...
          go test ./...
          ./build.sh

      # The tests must be able to stop a release: the binary updates every server by itself, so a
      # broken tunnel would spread. Compile them first (a compile error is never "flaky"), then run
      # them; a failed run gets one more try on a single thread because the tests use real sockets.
      # the panel script is its parts in assets/panel/js joined in order: it must still be valid JavaScript
      - name: Panel script syntax
        run: cat assets/panel/js/*.js > /tmp/kanki-panel.js && node --check /tmp/kanki-panel.js

      - name: Compile the tests
        run: cargo test --no-run

      - name: Tests (a real entry and exit on this machine, TCP and UDP)
        run: cargo test -- --nocapture --test-threads=4 || cargo test -- --nocapture --test-threads=1

      # 3.69: the release signing public key goes into the program: it checks every update with it before running
      # it. 3.72: it is the public half of the secret MINISIGN_SECRET_KEY itself (so the two can never disagree);
      # the variable KANKI_UPDATE_PUBKEY is used only when the secret is not there
      - name: The update key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          VAR_KEY: ${{ vars.KANKI_UPDATE_PUBKEY }}
        run: |
          set -euo pipefail
          k="${VAR_KEY:-}"
          if [ -n "${MINISIGN_SECRET_KEY:-}" ]; then
            k=$(printf '%s\n' "$MINISIGN_SECRET_KEY" | python3 scripts/minisign_pub.py)
            if [ -n "${VAR_KEY:-}" ] && [ "$k" != "$VAR_KEY" ]; then
              echo "::warning::the variable KANKI_UPDATE_PUBKEY is not the public key of MINISIGN_SECRET_KEY: the secret's own public key is used"
            fi
          fi
          echo "KANKI_UPDATE_PUBKEY=$k" >> "$GITHUB_ENV"
          echo "update key: ${k:-none}"

      - name: Build
        run: cargo build --release

      - name: Package
        if: github.ref == 'refs/heads/main'
        run: |
          cp target/release/kanki-panel kanki-panel
          sha256sum kanki-panel > kanki-panel.sha256
          grep -m1 '^version' Cargo.toml | cut -d'"' -f2 > version.txt
          cat version.txt

      - name: Keep the release files for the publish job
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            kanki-panel
            kanki-panel.sha256
            version.txt
          retention-days: 3

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # only scripts/ (the update key's public half), before the release files arrive (a checkout cleans the folder)
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Check the files
        run: sha256sum -c kanki-panel.sha256 && cat version.txt

      # 3.69: signed with minisign (secret MINISIGN_SECRET_KEY: a key made with `minisign -G -W`; variable
      # KANKI_UPDATE_PUBKEY: its public key). No signature, no release: the servers refuse an unsigned program.
      - name: Sign the program
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::the secret MINISIGN_SECRET_KEY (a key made with: minisign -G -W) must be set to publish"
            exit 1
          fi
          # the public half of the secret key: the same one the build put into the program
          KANKI_UPDATE_PUBKEY=$(printf '%s\n' "$MINISIGN_SECRET_KEY" | python3 scripts/minisign_pub.py)
          # the runner's package lists are empty until updated (minisign is in Ubuntu's universe)
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq minisign >/dev/null
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          # the key file as minisign writes it (a secret saved without its comment line gets one)
          if printf '%s\n' "$MINISIGN_SECRET_KEY" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          else
            printf 'untrusted comment: minisign secret key\n%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          fi
          minisign -S -s "$key" -m kanki-panel -x kanki-panel.minisig -t "kanki-panel $(cat version.txt)"
          minisign -V -P "$KANKI_UPDATE_PUBKEY" -m kanki-panel -x kanki-panel.minisig

      - name: Publish to Releases (tag "latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kanki Panel (latest)
          make_latest: true
          files: |
            kanki-panel
            kanki-panel.sha256
            kanki-panel.minisig
            version.txt
