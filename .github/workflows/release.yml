name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The tests must be able to stop a release: the binary updates every server by itself, so a
      # broken tunnel would spread. Compile them first (a compile error is never "flaky"), then run
      # them; a failed run gets one more try on a single thread because the tests use real sockets.
      - name: Compile the tests
        run: cargo test --no-run

      # the tests listen on fixed ports 41000-44999; keep Linux from giving those ports to
      # outgoing connections of other tests running at the same time ("address in use" flakes)
      - name: Reserve the test ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=41000-44999

      - name: Tests (a real entry and exit on this machine, TCP and UDP)
        run: cargo test -- --nocapture --test-threads=4 || cargo test -- --nocapture --test-threads=1

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          cp target/release/kanki-panel kanki-panel
          sha256sum kanki-panel > kanki-panel.sha256
          grep -m1 '^version' Cargo.toml | cut -d'"' -f2 > version.txt
          cat version.txt

      - name: Publish to Releases (tag "latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kanki Panel (latest)
          make_latest: true
          files: |
            kanki-panel
            kanki-panel.sha256
            version.txt
