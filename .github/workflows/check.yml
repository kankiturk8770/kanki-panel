name: check (branch, no release)
on:
  push:
    branches-ignore: [main]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-run
      - name: keep the fixed test ports out of the automatic port range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=41000-44999
      - name: tests six times, report any failure
        run: |
          set +e
          fails=0
          for i in 1 2 3 4 5 6 7 8; do
            cargo test -- --nocapture --test-threads=4 > out$i.txt 2>&1
            if [ $? -ne 0 ]; then
              fails=$((fails+1))
              msg=$(grep -E "^test .*FAILED|panicked at|^---- " out$i.txt | grep -v "a_poisoned_lock\|busy_guard" | head -20 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
              echo "::error title=run $i failed::$msg"
              msg=$(grep -A12 "^---- \|^failures:" out$i.txt | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
              echo "::error title=run $i detail::$msg"
            fi
          done
          echo "::error title=summary::$fails of 8 runs failed"
