name: diag-v290
on:
  push:
    branches: [diag-v290]
jobs:
  t:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: compile tests
        run: cargo test --no-run
      - name: tests::tunnel_tcpmux_reverse
        if: always()
        timeout-minutes: 4
        run: |
          set +e
          cargo test --quiet -- --exact tunnel::tests::tunnel_tcpmux_reverse --nocapture > out.txt 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            m=$(grep -v '^$' out.txt | tail -n 40 | cut -c1-400 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=FAILED tests::tunnel_tcpmux_reverse::$m"
            exit 1
          fi
